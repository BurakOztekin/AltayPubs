<div class="container mt-5 pt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-5-strong">
        <div class="card-header text-center bg-primary text-white py-3">
          <h4 class="mb-0">ALTAY Pubs - System Login</h4>
        </div>
        <div class="card-body p-4">

          <div class="alert alert-danger" *ngIf="errorMessage">
            {{ errorMessage }}
          </div>

          <form (ngSubmit)="onSubmit()">
            <div class="form-outline mb-4">
              <label class="form-label fw-bold" for="username">Username</label>
              <input type="text" id="username" class="form-control form-control-lg" name="username" [(ngModel)]="credentials.username" required />
            </div>

            <div class="form-outline mb-4">
              <label class="form-label fw-bold" for="password">Password</label>
              <input type="password" id="password" class="form-control form-control-lg" name="password" [(ngModel)]="credentials.password" required />
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block w-100 mt-2">
              Login
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
