<h1 id="tableLabel">Authors List</h1>

<p>This table retrieves its data directly from the SQL Server database.</p>

<p *ngIf="!authors || authors.length === 0"><em>Loading...</em></p>

<table class='table table-striped' aria-labelledby="tableLabel" *ngIf="authors && authors.length > 0">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Last Name</th>
      <th>Telephone</th>
      <th>City</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let author of authors">
      <td>{{ author.auId }}</td>
      <td>{{ author.auFname }}</td>
      <td>{{ author.auLname }}</td>
      <td>{{ author.phone }}</td>
      <td>{{ author.city }}</td>
    </tr>
  </tbody>
</table>
